name: Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile CV from LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: arul_rhik_mazumder_cv.tex

      - name: Publish CV PDF and build metadata
        run: bash scripts/build-cv.sh --stage-only

      - name: Stage site for deployment
        run: |
          mkdir -p _site
          cp -r index.html publications.html main.css site.js media cv _site/
          cp projects.html education.html courses.html blog.html _site/ 2>/dev/null || true
          cp arul_rhik_mazumder_cv.tex _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
